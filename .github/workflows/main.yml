name: radar-archive
# NOTE: GitHub's `schedule` event is BEST-EFFORT, not a guarantee.
# A `*/10` cron on a low-activity repo typically fires every 30-120+ min, and
# GitHub can drop queued scheduled runs entirely under load (worst at :00).
# For a true 10-min cadence use an external cron that calls workflow_dispatch:
#   curl -X POST -H "Authorization: Bearer <PAT>" -H "Accept: application/vnd.github+json" \
#     https://api.github.com/repos/subhrajitjubu/radar_api/actions/workflows/main.yml/dispatches \
#     -d '{"ref":"main"}'
# (PAT needs Actions: Read and write.)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      # Node 24 action majors — silences the "Node.js 20 is deprecated" runner warning.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Fetch latest radar frame and save global tiles to images/YYYY/
        run: |
          set -e
          python3 << 'PY'
          import json, os, urllib.request, urllib.error, base64, datetime, pathlib, math, sys

          # Fetch weather-maps.json
          req = urllib.request.Request("https://api.rainviewer.com/public/weather-maps.json", headers={"User-Agent":"radar_api bot"})
          with urllib.request.urlopen(req) as r:
              j = json.loads(r.read().decode())
          host = j["host"]
          past = j["radar"]["past"]
          if not past:
              print("No past frames"); sys.exit(0)
          latest = past[-1]
          t = latest["time"]
          dt = datetime.datetime.utcfromtimestamp(t)
          yyyy = dt.strftime("%Y")
          stamp = dt.strftime("%Y%m%d_%H%M")  # UTC
          path_suffix = latest["path"]  # e.g. /v2/radar/1710000000

          print(f"Latest frame: {t} -> {dt} UTC -> images/{yyyy}/{stamp}.png  host={host} path={path_suffix}")

          # Global tiles: z=3 => 8x8 = 64 tiles of 256px, composite into one PNG.
          Z = 3
          NX = 2**Z
          NY = 2**Z

          try:
              from PIL import Image
              import io
          except ImportError:
              os.system("pip install Pillow -q")
              from PIL import Image
              import io

          W, H = NX*256, NY*256
          canvas = Image.new("RGBA", (W, H), (0,0,0,0))

          def fetch_tile(x,y):
              url = f"{host}{path_suffix}/256/{Z}/{x}/{y}/2/1_1.png"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"radar_api bot"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return Image.open(io.BytesIO(r.read())).convert("RGBA")
              except Exception:
                  # 404 = no coverage at that tile, keep transparent
                  return None

          import concurrent.futures
          tiles = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              futs = {(x,y): ex.submit(fetch_tile, x, y) for x in range(NX) for y in range(NY)}
              for (x,y), fut in futs.items():
                  tiles[(x,y)] = fut.result()

          fetched = sum(1 for v in tiles.values() if v is not None)
          print(f"Fetched {fetched}/{NX*NY} tiles at z={Z}")

          for (x,y), img in tiles.items():
              if img is not None:
                  canvas.paste(img, (x*256, y*256), img)

          thumb = canvas.copy()
          thumb.thumbnail((1024, 512))

          out_dir = pathlib.Path(f"images/{yyyy}")
          out_dir.mkdir(parents=True, exist_ok=True)
          out_path = out_dir / f"{stamp}.png"
          thumb_path = out_dir / f"{stamp}_thumb.png"

          if out_path.exists():
              print(f"Already exists: {out_path} — skip")
          else:
              canvas.save(out_path, "PNG", optimize=True)
              thumb.save(thumb_path, "PNG", optimize=True)
              print(f"Saved {out_path} ({out_path.stat().st_size} bytes) + {thumb_path}")

              manifest_path = out_dir / "manifest.json"
              if manifest_path.exists():
                  manifest = json.loads(manifest_path.read_text())
              else:
                  manifest = []
              manifest.append({"time": t, "iso": dt.isoformat()+"Z", "path": path_suffix, "file": f"{stamp}.png", "thumb": f"{stamp}_thumb.png", "z": Z, "host": host})
              seen = {}
              for e in manifest: seen[e["time"]] = e
              manifest = sorted(seen.values(), key=lambda e: e["time"])
              manifest_path.write_text(json.dumps(manifest, indent=2))
              print(f"Updated {manifest_path} ({len(manifest)} entries)")

          PY
      - name: Commit and push if changed
        run: |
          git config --global user.name "subhrajitjubu"
          git config --global user.email "66462700+subhrajitjubu@users.noreply.github.com"
          git add images/
          if git diff --cached --quiet; then
            echo "No new images — nothing to commit"
          else
            git commit -m "chore: archive radar $(date -u +%Y%m%d_%H%M) global z3"
            # rebase in case another scheduled run pushed while we were working
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push
          fi
